
name: Build Reply AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir source
          unzip -q ReplyAI_v2_Android_Project.zip -d source
          echo "Project files:"
          find source -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          FILE=$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Android Gradle settings file not found"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReplyAI-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
